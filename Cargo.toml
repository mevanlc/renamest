[package]
name = "renamest"
version = "0.0.0" # Release workflows stamp the tag version.
authors = ["Mike Clark", "Indiana Kernick <indiana.kernick@gmail.com>"]
description = "Cross-platform file renaming without overwriting existing destinations."
categories = ["filesystem"]
keywords = ["rename", "file"]
homepage = "https://github.com/mevanlc/renamest"
repository = "https://github.com/mevanlc/renamest"
documentation = "https://docs.rs/renamest"
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.98"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3"

[features]
# Kept for compatibility with older releases. Linux support no longer needs
# build-time probing.
always-supported = []
always-fallback = []
