name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  UV_PYTHON: 3.14.8
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      version: ${{ steps.prepare.outputs.version }}
      toolchain: ${{ steps.prepare.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version || '0.0.0' }}
        run: |
          version=$(uv run scripts/release.py version "$RELEASE_VERSION")
          matrix=$(uv run scripts/release.py matrix)
          toolchain=$(uv run scripts/release.py toolchain)
          {
            echo "version=$version"
            echo "matrix=$matrix"
            echo "toolchain=$toolchain"
          } >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: quality
      - name: Install actionlint 1.7.12
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          install "$RUNNER_TEMP/actionlint" "$HOME/.cargo/bin/actionlint"
      - name: Release helper tests and workflow lint
        run: |
          uv run scripts/test_release.py
          actionlint
      - name: Stamp version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/release.py stamp "$RELEASE_VERSION"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: matrix.kind != 'freebsd'
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.libc == 'musl'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          target_key="${TARGET^^}"
          target_key="${target_key//-/_}"
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: matrix.kind != 'freebsd'
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        if: matrix.kind != 'android' && matrix.kind != 'freebsd'
        with:
          tool: cargo-nextest@0.9.132
      - name: Stamp version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/release.py stamp "$RELEASE_VERSION"
      - name: Test library on the target architecture
        if: matrix.kind != 'android' && matrix.kind != 'freebsd'
        env:
          TARGET: ${{ matrix.target }}
          TARGET_KIND: ${{ matrix.kind }}
        run: |
          export RENAMEST_EXPECT_NATIVE=1
          cargo nextest run --locked --all-targets --target "$TARGET"
          if [ "$TARGET_KIND" = linux ]; then
            export RENAMEST_EXPECT_NATIVE=0
          fi
          cargo nextest run --locked --all-targets --all-features --target "$TARGET"
          cargo test --doc --locked --target "$TARGET"
          cargo test --doc --locked --all-features --target "$TARGET"
          cargo build --release --locked --lib --target "$TARGET"
      - name: Compile-check Android library and tests
        if: matrix.kind == 'android'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo check --locked --all-targets --target "$TARGET"
          cargo check --locked --all-targets --all-features --target "$TARGET"
      - name: Test FreeBSD ${{ matrix.release }} in a VM
        if: matrix.kind == 'freebsd'
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: |
            set -eu
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain '${{ needs.prepare.outputs.toolchain }}' --component clippy --no-modify-path
            fetch -o /tmp/nextest.tar.gz https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.132/cargo-nextest-0.9.132-x86_64-unknown-freebsd.tar.gz
            test "$(sha256 -q /tmp/nextest.tar.gz)" = 64c776fe02a2de1f4eadc0bfc3817568f77521acd4de3c270699629d828d5daa
            tar -xzf /tmp/nextest.tar.gz -C "$HOME/.cargo/bin" cargo-nextest
          run: |
            set -eu
            export PATH="$HOME/.cargo/bin:$PATH"
            export RENAMEST_EXPECT_NATIVE='${{ matrix.native }}'
            cargo clippy --locked --all-targets -- -D warnings
            cargo clippy --locked --all-targets --all-features -- -D warnings
            cargo nextest run --locked --all-targets
            cargo nextest run --locked --all-targets --all-features
            cargo test --doc --locked
            cargo test --doc --locked --all-features
            cargo build --release --locked --lib

  crate:
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: crate
      - name: Stamp version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run scripts/release.py stamp "$RELEASE_VERSION"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-nextest@0.9.132
      - name: Verify publishing and library use from the packaged source
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo package --locked --allow-dirty
          cargo publish --dry-run --locked --allow-dirty --no-verify
          manifest="target/package/renamest-$RELEASE_VERSION/Cargo.toml"
          cargo nextest run --locked --manifest-path "$manifest"
          cargo nextest run --locked --all-features --manifest-path "$manifest"
          cargo test --doc --locked --manifest-path "$manifest"
          cargo test --doc --locked --all-features --manifest-path "$manifest"
          uv run scripts/release.py check-consumer
          uv run scripts/release.py copy-crate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-crate
          path: dist/*.crate
          if-no-files-found: error
          retention-days: 30
